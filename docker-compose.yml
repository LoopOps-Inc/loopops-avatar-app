include:
  - services/agent/docker-compose.yml

services:
  agent:
    environment:
      AUTH_ACCESS_TOKEN_MAX_TTL_S: "604800"
      LIVEAVATAR_IS_SANDBOX: "${LIVEAVATAR_IS_SANDBOX:-true}"
      LIVEAVATAR_VOICE_ID: "${LIVEAVATAR_VOICE_ID:-}"

  web-token:
    image: actinver-agent:local
    user: "0:0"
    restart: "no"
    environment:
      SECRETS_MANAGER_ENDPOINT: http://floci:4566
      SECRETS_MANAGER_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - webtokens:/tokens
    depends_on:
      floci:
        condition: service_started
      floci-init:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        python - <<'PY'
        import os
        import sys
        import time

        import boto3

        from actinver_agent.auth import devkeys

        endpoint = os.environ["SECRETS_MANAGER_ENDPOINT"]
        client = boto3.client(
            "secretsmanager",
            endpoint_url=endpoint,
            region_name=os.environ.get("SECRETS_MANAGER_REGION", "us-east-1"),
            aws_access_key_id=os.environ.get("AWS_ACCESS_KEY_ID", "test"),
            aws_secret_access_key=os.environ.get("AWS_SECRET_ACCESS_KEY", "test"),
        )
        deadline = time.time() + 60
        key = None
        while time.time() < deadline:
            try:
                key = client.get_secret_value(SecretId="actinver/dev-signing-key")["SecretString"]
                break
            except Exception as exc:
                print("[web-token] waiting for actinver/dev-signing-key:", exc, file=sys.stderr)
                time.sleep(3)
        if not key:
            sys.exit("[web-token] secret not available at " + endpoint)
        token = devkeys.mint_dev_access_token(key, "cl_demo_moderado", ttl_s=604800)
        with open("/tokens/token", "w") as handle:
            handle.write(token)
        os.chmod("/tokens/token", 0o666)
        print("[web-token] minted 7d dev token for cl_demo_moderado")
        print("[web-token] " + token)
        PY

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    environment:
      AGENT_DEV_TOKEN_FILE: /tokens/token
    volumes:
      - webtokens:/tokens:ro
    depends_on:
      web-token:
        condition: service_completed_successfully
      agent:
        condition: service_started

volumes:
  webtokens:
