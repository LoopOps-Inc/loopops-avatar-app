confirmed_decisions:
  - Splash is a timed navy/gold overlay on `/` using existing tokens. Skip when prefers-reduced-motion or a valid token already exists. No `/splash` route.
  - Login lives at `/` with numeric ClientId, password string, and filled-dark submit.
  - Successful mint stores the token via setDevAuth and navigates to `/demo`.
  - Unauthenticated `/demo` redirects to `/`. Authenticated `/` redirects to `/demo`.
  - Remove InvestorSelect from StartScreen. Stop minting on Start. Login is the identity switcher.
  - mintDevToken POSTs `{ client_id, password }`. ClientId is digits sent as a string.
  - Map UNAUTHENTICATED and VALIDATION_ERROR to i18n. Do not persist the password.
  - Web-only. Native inherits via WebView at `/`. Do not change services/agent.
  - Add password to DevTokenRequestSchema in packages/contracts.
