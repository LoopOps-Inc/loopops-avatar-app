name: agent-ci

on:
  push:
    paths: ["services/agent/**", ".github/workflows/agent-ci.yml"]
  pull_request:
    paths: ["services/agent/**", ".github/workflows/agent-ci.yml"]

defaults:
  run:
    working-directory: services/agent

jobs:
  quality:
    name: lint, types, tests, build-time assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv --python 3.12 .venv && uv pip install -e '.[dev]'
      - name: Ruff (incl. S bandit and ASYNC rules)
        run: .venv/bin/ruff check src tests scripts migrations && .venv/bin/ruff format --check src tests scripts migrations
      - name: mypy --strict
        run: .venv/bin/mypy src
      - name: Unit, graph, API, contract tests (80 % floor; 100 % suitability replay)
        run: .venv/bin/pytest tests/unit tests/graph tests/api tests/contract -q
      - name: Build-time assertions (ADR encodings)
        run: .venv/bin/pytest tests/assertions -q --no-cov
      - name: No vendor secrets in the client bundle source (ADR-0001, ADR-0008)
        working-directory: .
        run: |
          ! grep -rEn "X-API-KEY|livekit_agent_token|api\.liveavatar\.com" apps/web/src || (echo "vendor secret marker found in apps/web/src" && exit 1)
          # apps/web/vite.config.ts injects the dev key server-side and is excluded on purpose.

  integration:
    name: docker compose stack + integration suite
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv --python 3.12 .venv && uv pip install -e '.[dev]'
      - name: Start the stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:8443/readyz && break; sleep 3; done
          curl -sf http://localhost:8443/readyz
      - name: Integration tests
        env:
          AGENT_BASE_URL: http://localhost:8443
        run: .venv/bin/pytest tests/integration -m integration -q --no-cov
      - name: Smoke (step-by-step curls)
        run: bash scripts/smoke.sh || true
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300

  image:
    name: image, SBOM, scans
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t actinver-agent:ci .
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: actinver-agent:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: actinver-agent:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
