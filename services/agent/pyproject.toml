[project]
name = "actinver-agent"
version = "0.1.0"
description = "Actinver AI Advisor - agent backend (bff, orchestrator, avatar broker, voice pipeline, suitability, guardrail, audit, transaction services)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.52,<0.53",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "langchain-core>=1.6,<2",
  "google-genai>=2.21,<3",
  "google-cloud-speech>=2.40,<3",
  "google-cloud-texttospeech>=2.37,<3",
  "httpx>=0.28,<0.29",
  "websockets>=14,<17",
  "redis[hiredis]>=8.1,<9",
  "asyncpg>=0.31,<0.32",
  "psycopg[binary,pool]>=3.3,<4",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.19,<2",
  "structlog>=26,<27",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-exporter-otlp>=1.44,<2",
  "tenacity>=9.1,<10",
  "orjson>=3.12,<4",
  "pyjwt[crypto]>=2.13,<3",
  "cryptography>=45",
  "sse-starlette>=3.4,<4",
  "aioboto3>=15.5,<16",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "respx>=0.23,<0.24",
  "ruff>=0.16,<0.17",
  "mypy>=1.19,<3",
  "hypothesis>=6.167,<7",
  "freezegun>=1.5,<2",
  "fakeredis>=2.37,<3",
  "types-pyyaml",
]

[project.scripts]
actinver-agent = "actinver_agent.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF", "S", "ASYNC"]
ignore = [
  "S101",   # assert is used for invariants and in tests
  "RUF012", # pydantic/typed dict mutable defaults are fine
  "RUF001", "RUF002", "RUF003", # Spanish punctuation in strings and comments
  "N818",   # exception names follow the reference architecture (EvidenceUnavailable, ...)
  "E501",   # long lines: formatted by ruff format; Spanish literals may exceed 100 columns
  "B008",   # FastAPI Depends()/Query() in defaults is the framework idiom
  "A002",   # `type` as a keyword argument mirrors the API field name
  "ARG005", # rule predicates share one (client, product, ctx) signature by design
  "S110", "S112", "SIM105", # deliberate best-effort suppressions on non-critical paths
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "ARG001", "ARG002", "E501"]
"scripts/**" = ["S603", "S607", "T201"]
"migrations/**" = ["E501", "S608"]
"src/actinver_agent/persistence/repositories.py" = ["S608"]
"src/actinver_agent/api/routes/**" = ["ARG001"]
"src/actinver_agent/graph/state.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["actinver_agent"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["actinver_agent.adapters.*"]
# Provider SDKs are partially typed; the adapter boundary absorbs that.
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs the docker compose stack (postgres, redis, floci)",
  "slow: long-running suites",
]
addopts = "-m 'not integration' --cov=actinver_agent --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/actinver_agent"]
omit = [
  "src/actinver_agent/adapters/*",           # provider SDK adapters need credentials; contract-tested separately
  "src/actinver_agent/cli.py",
  "src/actinver_agent/clients/*_http.py",    # contract-first clients pending the core API inventory (README §6)
  "src/actinver_agent/clients/http_base.py",
  "src/actinver_agent/persistence/repositories.py",  # covered by tests/integration against Postgres
  "src/actinver_agent/persistence/retention.py",
  "src/actinver_agent/persistence/wiring.py",
  "src/actinver_agent/retrieval/retriever.py",       # PgVectorStore needs Postgres; MemoryVectorStore is unit-tested
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actinver_agent"]
