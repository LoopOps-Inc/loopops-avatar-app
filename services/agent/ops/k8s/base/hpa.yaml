# Autoscaling on concurrent turns (a custom metric), not CPU
# (docs/04-backend/01 §7, §5). The metric `concurrent_turns` is derived by the
# Prometheus adapter from the OTel counter `turn.count` minus completions, or
# directly from the gauge exported by the agent; the adapter rule is owned by
# Platform. Until the adapter exists this HPA is a documented placeholder and
# `replicas` in agent.yaml applies.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-orchestrator
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      # Avatar sessions are pinned: scale down slowly and let drains finish.
      stabilizationWindowSeconds: 900
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
  metrics:
    - type: Pods
      pods:
        metric:
          name: concurrent_turns
        target:
          type: AverageValue
          averageValue: "40"
---
# The broker's real limit is connection count (one vendor WebSocket per
# session), capped independently by LIVEAVATAR_MAX_CONCURRENT_SESSIONS.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: guardrail-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: guardrail-service
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Pods
      pods:
        metric:
          name: concurrent_turns
        target:
          type: AverageValue
          averageValue: "80"
