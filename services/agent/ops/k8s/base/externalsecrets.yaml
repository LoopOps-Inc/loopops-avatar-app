# External Secrets Operator: syncs the enterprise secrets manager into
# Kubernetes Secrets that are mounted as files under /var/run/secrets/actinver
# and referenced by the application as `file://<key>` (docs/05-security/04 §4).
# Each deployment mounts ONLY the secret it needs; in particular the agent never
# mounts `suitability-hmac` (crown jewel, ADR-0005) and the suitability service
# never mounts the LiveAvatar key.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: actinver-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: mx-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: advisor-common
spec:
  refreshInterval: 1h
  secretStoreRef: { name: actinver-secrets, kind: SecretStore }
  target: { name: advisor-common }
  data:
    - secretKey: database-url
      remoteRef: { key: actinver/advisor/database-url }
    - secretKey: redis-url
      remoteRef: { key: actinver/advisor/redis-url }
    - secretKey: client-hash-salt
      remoteRef: { key: actinver/advisor/client-hash-salt }
    - secretKey: formspec-hmac
      remoteRef: { key: actinver/formspec-hmac }
    - secretKey: object-store-access-key
      remoteRef: { key: actinver/advisor/object-store, property: access_key }
    - secretKey: object-store-secret-key
      remoteRef: { key: actinver/advisor/object-store, property: secret_key }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: advisor-agent
spec:
  refreshInterval: 1h
  secretStoreRef: { name: actinver-secrets, kind: SecretStore }
  target: { name: advisor-agent }
  data:
    - secretKey: liveavatar-api-key
      remoteRef: { key: actinver/liveavatar/api-key }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: advisor-suitability
spec:
  refreshInterval: 1h
  secretStoreRef: { name: actinver-secrets, kind: SecretStore }
  target: { name: advisor-suitability }
  data:
    - secretKey: suitability-hmac
      remoteRef: { key: actinver/suitability-hmac }
