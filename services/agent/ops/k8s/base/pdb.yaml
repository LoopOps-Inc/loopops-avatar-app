# minAvailable 60 % so a node drain cannot take a service down
# (docs/04-backend/01 §7).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-orchestrator
spec:
  minAvailable: 60%
  selector:
    matchLabels: { app: agent-orchestrator }
---
