# Local OpenTelemetry collector (ADR-0016). Receives OTLP/gRPC from every
# service and prints to the collector log. In dev/staging/prod the exporters
# are Prometheus + Loki + Tempo inside the perimeter; content never leaves.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
  # Defence in depth: the services already redact content (observability/setup.py
  # `_drop_content`); this drops the same keys if a span ever carries them.
  attributes/redact:
    actions:
      - key: prompt
        action: delete
      - key: response
        action: delete
      - key: speech
        action: delete
      - key: transcript
        action: delete
      - key: client_id
        action: delete

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [debug]
