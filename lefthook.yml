pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,jsx,tsx,json,css,md}'
      run: npx prettier --write {staged_files}
      stage_fixed: true

    eslint:
      # Root ESLint must be v10+ (see root package.json). Native still nests ESLint 8.
      glob: 'apps/web/**/*.{js,ts,jsx,tsx}'
      run: npx eslint --fix {staged_files}

# CI runs lint + check + build. Pre-push only verifies the production build once
# (includes tsc) — avoids duplicate full-project typecheck on every commit/push.
pre-push:
  commands:
    build:
      run: npm run build
